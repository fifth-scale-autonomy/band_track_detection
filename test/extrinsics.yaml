# 시험용 고정 값: fifth_scale_bringup/config/extrinsics.yaml 을 2026-10-14 (pitch 11.3 도) 에 복사. 시험이 실제 장착값에 따라 바뀌지 않게 따로 둔다.
# 센서 장착 위치 (base_link 기준, REP-103: x 전방, y 좌측, z 상방, 단위 m / rad)
# base_link 원점: 후륜축 중심 바로 아래 지면
#
# sensors.launch.py 가 이 파일을 읽어 정적 TF를 발행한다.
# 값을 바꾼 뒤에는 colcon build 없이도 반영되도록 --symlink-install 로 빌드해 둔다.

laser:
  parent: base_link
  child: laser
  # 실측(2026-10-07): 회전 중심 x=0.95, y=0, 스캔 평면 높이 z=0.48
  x: 0.95
  y: 0.0
  z: 0.48
  roll: 0.0
  pitch: 0.0
  # 라이다 로고(정면)를 차량 전방으로 장착.
  # sllidar_ros2 는 ROS 각도 = pi - 원본 각도로 변환하므로 laser +x 는 로고 반대쪽(차량 후방)을 향한다.
  # 그래서 yaw = pi 로 돌려 base_link 와 방향을 맞춘다. (1단계 실물 시험으로 확인)
  yaw: 3.141592653589793

camera_link:
  parent: base_link
  child: camera_link
  # 실측(2026-10-07): 렌즈 중심 x=0.53, y=0, z=0.92. 숙인 각도 실측 22도는 맞지 않았다
  # (라이다 점이 천장 쪽에 투영됨). 복도 소실점 + 라이다로 거리를 잰 콘 145개 관측(YOLO 박스 아랫변·중심)으로
  # f, pitch, yaw 를 함께 추정한 값을 쓴다: pitch 6.5도, yaw -1.15도 (잔차 밑면 1.7 px, 중심 3.2 px).
  # 내부 캘리브레이션 전 추정이므로 2단계 후 4단계에서 다시 맞춘다.
  # REP-103 에서 +pitch 는 x축이 아래로 숙는 방향이다.
  x: 0.53
  y: 0.0
  z: 0.92
  roll: 0.0
  # 2026-10-14 카메라를 다시 고정함. 사용자 추정 8~9 도 -> 8.5 도 (측정 전 임시값).
  # 같은 날 띠 트랙 녹화에서 9 도 근처가 띠 검출률이 높고 흰 띠 폭(10 cm)도 맞는 쪽이었다. 이전 값 6.5 도.
  # 이후 사용자 지시로 7.0 도 (측정 전).
  # 2026-10-14 트랙 폭 1.5 m (사용자, 흰 띠 중심 사이) 로 확인: 띠 트랙 녹화 3 개에서 검출한 띠가 지면 투영에서 평행해지는
  # (가까운 2.2~3 m 와 먼 4~5.5 m 좌우 간격이 같아지는) 각도가 11.3 도이고, 그때 간격 1.54~1.58 m.
  # 7.0 도에서는 먼 간격이 15% 넓고 간격 1.81 m 였다. 임시 내부 파라미터 기준 추정 (각도계 측정 아님).
  pitch: 0.1972   # 11.3 deg (띠 평행 + 트랙 폭으로 추정)
  yaw: -0.0201    # -1.15 deg (추정)

camera_optical_frame:
  parent: camera_link
  child: camera_optical_frame
  # 광학 프레임: z 전방, x 우측, y 하방 (고정 회전)
  x: 0.0
  y: 0.0
  z: 0.0
  roll: -1.5707963267948966
  pitch: 0.0
  yaw: -1.5707963267948966
